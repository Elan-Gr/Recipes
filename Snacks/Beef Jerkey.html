<h1>Beef Jerkey</h1>
<p>Cut chuck roast into thin pieces. Marinate in whatever flavorings you would like. Lie beef flat on baking sheet (preferably on top of a rack). Bake at 175 degrees for around 5 hours, flipping meat half way through the bake.</p>
