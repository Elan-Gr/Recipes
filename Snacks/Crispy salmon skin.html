<h1>Crispy salmon skin</h1>
<p>Remove skin from salmon. You can do this by fileting the salmon or by cooking the salmon and then pulling the meat off the skin. Then, roast the skin on parchment paper at 400 degrees for about 15 minutes until golden and crispy.</p>
