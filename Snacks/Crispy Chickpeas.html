<h1>Crispy Chickpeas</h1>
<p>Rinse and dry canned chickpeas. Coat in olive oil, salt, and pepper. Roast at 400 degrees on a baking sheet with parchment paper for about 45 minutes. Toss the chickpeas halfway through baking.</p>
