<h1>Chocolate Ganache</h1>
<h2>Ingredients</h2>
<ul>
<li>226 g chocolate</li>
<li>240 g hot cream</li>
</ul>
<h2>Instructions</h2>
<ol>
<li>Mix the chocolate with the hot cream.</li>
<li>Stir until smooth.</li>
<li>Once the ganache has cooled, whip it up and use it as frosting — or pour the slightly warm ganache over cake.</li>
</ol>
