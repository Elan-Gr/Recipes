<h1>Chocolate Ganache</h1>
<p>Mix around one-part chocolate and one-part hot cream (226 g chocolate for 240 g cream). Stir until smooth.</p>
<p>Once ganache has cooled, you can whip it up and use it as frosting. Otherwise, you can pour slightly warm ganache over cake.</p>
