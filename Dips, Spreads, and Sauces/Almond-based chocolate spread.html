<h1>Almond-based chocolate spread</h1>
<h2>Ingredients</h2>
<ul>
<li>17 grams almond butter</li>
<li>25 grams chocolate chips</li>
</ul>
<h2>Instructions</h2>
<ol>
<li>Mix 17 grams almond butter for every 25 grams chocolate chips.</li>
<li>Melt in microwave and stir until combined.</li>
</ol>
