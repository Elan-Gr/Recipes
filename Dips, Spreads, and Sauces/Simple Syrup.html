<h1>Simple Syrup</h1>
<h2>Ingredients</h2>
<ul>
<li>1 cup (200 g) sugar</li>
<li>1 cup (240 g) water</li>
</ul>
<h2>Instructions</h2>
<ol>
<li>Dissolve 1 cup (200 g) sugar and 1 cup (240 g) water in saucepan.</li>
<li>Heat until boiling.</li>
<li>Remove from heat and cool.</li>
</ol>
