<h1>Cane&#x27;s Sauce</h1>
<h2>Ingredients</h2>
<ul>
<li>110 grams (0.5 cup) mayonnaise</li>
<li>60 grams (0.25 cup) ketchup</li>
<li>1 teaspoon black pepper</li>
<li>½ teaspoon garlic powder</li>
<li>¼ teaspoon Worcestershire sauce</li>
</ul>
<h2>Instructions</h2>
<ol>
<li>Let sit in fridge for 24 hours.</li>
</ol>
