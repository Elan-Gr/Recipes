<h1>Yogurt Shake</h1>
<h2>Ingredients</h2>
<ul>
<li>1 cup (245g) Chobani nonfat plain Greek yogurt</li>
<li>1 cup milk</li>
<li>Honey drizzle</li>
<li>Splash of vanilla extract</li>
</ul>
<h2>Instructions</h2>
<ol>
<li>Blend all ingredients until smooth.</li>
</ol>
<p><b>Nutrition (per shake):</b> ~320 cal, ~31g protein, ~37g carbs, ~5g fat.</p>
