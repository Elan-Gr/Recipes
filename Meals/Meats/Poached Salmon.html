<h1>Poached Salmon</h1>
<p>Place leaks, or other green leafy vegetables in pan or stockpot. Place filet of salmon on top. Pour over some cream and some stock. Add spices. Cover, bring to boil, and then simmer until fish is close to done. Remove lid and increase heat to reduce sauce.</p>
