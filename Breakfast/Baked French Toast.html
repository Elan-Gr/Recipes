<h1>Baked French Toast</h1>
<p>Slice bread thickly. Soak in custard mixture consisting of eggs, cream/milk, vanilla, salt, sugar, cinnamon, etc. Bake at 350 degrees for 15–20 minutes on parchment paper. Flip halfway through. Finish under the broiler to brown.</p>
