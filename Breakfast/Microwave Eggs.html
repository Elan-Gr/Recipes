<h1>Microwave Eggs</h1>
<h2>Ingredients</h2>
<ul>
<li>Butter</li>
<li>Egg</li>
<li>Salt</li>
</ul>
<h2>Instructions</h2>
<ol>
<li>Melt butter in microwave-safe bowl.</li>
<li>Crack egg and pierce yolk.</li>
<li>Add salt.</li>
<li>Microwave for 30–45 seconds.</li>
</ol>
