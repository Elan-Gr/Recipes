<h1>Overnight Oats</h1>
<h2>Ingredients</h2>
<ul>
<li>½ cup (40 grams) steel cut or quick oats</li>
<li>0.4–0.5 cups (100–125 grams) milk</li>
<li>Sweetener</li>
<li>Other toppings, as desired</li>
</ul>
<h2>Instructions</h2>
<ol>
<li>Mix the oats with the milk, sweetener, and other toppings.</li>
<li>Place in the fridge overnight.</li>
</ol>
