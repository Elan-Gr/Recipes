<h1>Seasoning Cast Iron</h1>
<h2>Ingredients</h2>
<ul>
<li>High smoke point oil</li>
</ul>
<h2>Instructions</h2>
<ol>
<li>Rub a very thin (as thin as possible) layer of the oil on the pan.</li>
<li>Place in the oven upside down at 450°F for one hour.</li>
<li>Turn off the oven and let the pan cool down in the oven.</li>
</ol>
