<h1>Avocado</h1>

<ul>
<li>Purchase the avocado while it is hard</li>
<li>Put the avocado in a paper bag at room temperature for 2-3 days</li>
<li>3 days for a hard avocado, 2 days for one that is somewhat soft</li>
<li>Eat after about 48 hours</li>
</ul>
